name: Bug report
description: Report a reproducible non-sensitive problem in the experimental Pico repository.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Do not include credentials, Home Assistant tokens, Wi-Fi details, private URLs, or sensitive logs. Report security issues privately to security@djconnect.dev."
  - type: textarea
    id: summary
    attributes:
      label: Summary
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Safe reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
