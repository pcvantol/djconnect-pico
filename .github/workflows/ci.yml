name: MicroPython CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  software-assurance-governance:
    name: Software Assurance governance
    permissions:
      contents: read
    uses: pcvantol/djconnect/.github/workflows/software-assurance-governance.yml@dd02d6470f061e6e755e6fb47ae5331c34f89875
    with:
      execution_profile: balanced
      owner: pcvantol/djconnect-pico

  validate:
    name: Syntax and host tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        with:
          python-version: "3.11"
      - name: Compile host-validated sources
        run: python -m compileall -q src tests
      - name: Run host-side unit tests
        run: python -m unittest discover -s tests -v
      - name: Check sensitive filenames are absent
        run: |
          if git ls-files | grep -E '(^|/)(secrets|credentials|\.env)(\.|$)'; then
            echo "Potential secret-bearing file is tracked."
            exit 1
          fi
